name: labbook
description: Aplikasi reservasi laboratorium kampus.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  google_sign_in: ^6.2.2
  flutter_svg: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.9.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/labbook_logo.png
    - assets/images/google_logo.png
    - assets/images/labbook-logo.svg
    - assets/images/labbook-logo-text.svg

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_1024.png"

